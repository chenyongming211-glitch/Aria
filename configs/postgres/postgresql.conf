# PostgreSQL Optimized Configuration for SD-WAN Controller
# Optimized for high concurrency scenarios

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

# Listen on all network interfaces (required for Docker networking)
listen_addresses = '*'

# Maximum number of concurrent connections
max_connections = 500

# Reserved connections for superuser
superuser_reserved_connections = 3

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------

# Shared memory buffer (recommend 25% of total RAM, but not more than 8GB)
# For a 4GB server, set to 1GB
shared_buffers = 256MB

# Memory for complex sort/hash operations per connection
work_mem = 8MB

# Memory for maintenance operations (VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 128MB

# Planner's assumption about OS cache size (50-75% of total RAM)
effective_cache_size = 1GB

#------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL)
#------------------------------------------------------------------------------

# WAL level for replication support
wal_level = replica

# Number of WAL buffers (default is 3% of shared_buffers)
wal_buffers = 16MB

# Checkpoint completion target (0.0-1.0, higher = more spread out)
checkpoint_completion_target = 0.9

# Maximum time between automatic WAL checkpoints
checkpoint_timeout = 10min

# Maximum size of WAL files to accumulate before checkpoint
max_wal_size = 1GB
min_wal_size = 256MB

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

# Planner cost estimates
random_page_cost = 1.1
effective_io_concurrency = 200

# Enable parallel queries
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Log slow queries (queries taking more than 1 second)
log_min_duration_statement = 1000

# Log lock waits
log_lock_waits = on

# Log checkpoints
log_checkpoints = on

#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------

# Enable autovacuum
autovacuum = on

# Maximum number of autovacuum workers
autovacuum_max_workers = 3

# Minimum time between autovacuum runs on any table
autovacuum_naptime = 1min

# Minimum number of tuple inserts/updates/deletes before vacuum
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Fraction of table size to add to threshold
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------

# Maximum time to wait for a lock (in milliseconds, 0 = wait forever)
lock_timeout = 30000

# Maximum time for a statement to complete
statement_timeout = 60000

# Deadlock detection timeout
deadlock_timeout = 1s

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Default timezone
timezone = 'Asia/Shanghai'

# Default text search configuration
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# CONNECTION POOLING OPTIMIZATION
#------------------------------------------------------------------------------

# Idle session timeout (close idle connections after this time)
idle_in_transaction_session_timeout = 60000

# TCP keepalives
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
