# Redis Optimized Configuration for SD-WAN Controller
# Optimized for high concurrency and persistence

################################## NETWORK ##################################

# Accept connections on all interfaces
bind 0.0.0.0

# Listen port
port 6379

# TCP backlog (high value for high concurrency)
tcp-backlog 511

# Close connection after client is idle for N seconds (0 to disable)
timeout 300

# TCP keepalive
tcp-keepalive 300

################################## GENERAL ##################################

# Run as daemon (disable in Docker)
daemonize no

# Supervised by systemd/upstart (auto for Docker)
supervised no

# PID file
pidfile /var/run/redis/redis-server.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file (empty for stdout - good for Docker)
logfile ""

# Number of databases
databases 16

################################## MEMORY ###################################

# Maximum memory limit (adjust based on available RAM)
# For production, recommend 25-50% of available RAM
maxmemory 512mb

# Memory eviction policy when maxmemory is reached
# volatile-lru: Remove least recently used keys with expire set
# allkeys-lru: Remove any least recently used keys
# volatile-ttl: Remove keys with shortest TTL
# noeviction: Return errors when memory limit is reached
maxmemory-policy volatile-lru

# Number of samples for LRU/TTL eviction (higher = more accurate but slower)
maxmemory-samples 10

# Active defragmentation (requires jemalloc)
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

################################ SNAPSHOTTING ################################

# RDB persistence (save <seconds> <changes>)
# Save if at least 1 key changed in 900 seconds
save 900 1
# Save if at least 10 keys changed in 300 seconds
save 300 10
# Save if at least 10000 keys changed in 60 seconds
save 60 10000

# Stop writes on background save error
stop-writes-on-bgsave-error yes

# Compress RDB files with LZF
rdbcompression yes

# RDB file checksum
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# RDB directory (must be writable)
dir /data

############################## APPEND ONLY MODE ##############################

# Enable AOF persistence
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# fsync policy:
# always: Slow but very safe
# everysec: Compromise (recommended)
# no: Let the OS decide
appendfsync everysec

# Don't fsync during BGSAVE/BGREWRITEAOF
no-appendfsync-on-rewrite no

# Auto-rewrite AOF when it grows by 100%
auto-aof-rewrite-percentage 100

# Minimum size for auto-rewrite
auto-aof-rewrite-min-size 64mb

# Load truncated AOF on startup
aof-load-truncated yes

# Use RDB preamble in AOF for faster loads
aof-use-rdb-preamble yes

################################ LUA SCRIPTING ###############################

# Max execution time for Lua scripts (in milliseconds)
lua-time-limit 5000

################################## SLOW LOG ##################################

# Slow log threshold (in microseconds)
# 10000 = 10ms
slowlog-log-slower-than 10000

# Maximum length of slow log
slowlog-max-len 128

################################ LATENCY MONITOR #############################

# Enable latency monitoring (threshold in milliseconds)
latency-monitor-threshold 100

############################# EVENT NOTIFICATION #############################

# Enable keyspace notifications for pub/sub
# K: Keyspace events
# E: Keyevent events
# g: Generic commands (DEL, EXPIRE, RENAME, ...)
# x: Expired events
# e: Evicted events
notify-keyspace-events "Kgxe"

############################### ADVANCED CONFIG ##############################

# Hash encoding threshold
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List encoding threshold
list-max-ziplist-size -2
list-compress-depth 0

# Set encoding threshold
set-max-intset-entries 512

# Sorted set encoding threshold
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation bytes limit
hll-sparse-max-bytes 3000

# Streams encoding
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing (use CPU idle time for rehashing)
activerehashing yes

# Client output buffer limits
# normal: 0 0 0 (no limit)
# replica: 256mb 64mb 60 (soft limit 64mb for 60s, hard limit 256mb)
# pubsub: 32mb 8mb 60 (for pub/sub clients)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Proto max bulk length
proto-max-bulk-len 512mb

# Hz (internal clock resolution, 10 is default, higher = more responsive but more CPU)
hz 10

# Dynamic hz (adjust based on client connections)
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB save incremental fsync
rdb-save-incremental-fsync yes

########################### THREADED I/O (Redis 6+) ##########################

# Number of I/O threads (0 = disabled, recommended: number of CPU cores - 1)
# Enable for high concurrency scenarios
io-threads 4

# Thread reads (enable for better read performance)
io-threads-do-reads yes
