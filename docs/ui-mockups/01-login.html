<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria SD-WAN - Login</title>
  <link rel="stylesheet" href="mockup.css">
  <style>
    /* Login page overrides - full dark theme, no sidebar layout */
    body {
      display: flex;
      min-height: 100vh;
      background: #0a0e1a;
      color: #e2e8f0;
      overflow: hidden;
      position: relative;
    }

    /* Floating gradient orbs background */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #3b82f6, #1d4ed8);
      top: -120px; left: -80px;
      animation-duration: 14s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #8b5cf6, #6d28d9);
      bottom: -100px; right: 10%;
      animation-duration: 18s;
      animation-delay: -4s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #06b6d4, #0891b2);
      top: 40%; left: 30%;
      animation-duration: 16s;
      animation-delay: -8s;
    }
    .orb-4 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, #3b82f6, #2563eb);
      bottom: 10%; left: 5%;
      animation-duration: 20s;
      animation-delay: -2s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      25% { transform: translateY(-30px) translateX(15px); }
      50% { transform: translateY(-15px) translateX(-20px); }
      75% { transform: translateY(20px) translateX(10px); }
    }

    /* Split layout */
    .login-container {
      display: flex;
      width: 100%;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* Left panel - branding */
    .login-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
    }

    .brand-logo {
      margin-bottom: 24px;
      animation: logoFloat 6s ease-in-out infinite;
    }
    .brand-logo .logo-mark {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8, #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 36px;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
      margin: 0 auto 20px;
    }
    .brand-logo h1 {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #f8fafc, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      letter-spacing: -1px;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .brand-tagline {
      font-size: 16px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 40px;
      max-width: 300px;
      line-height: 1.6;
    }

    .feature-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 400px;
    }
    .feature-tag {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      color: #cbd5e1;
      transition: all 0.3s;
    }
    .feature-tag:nth-child(1) {
      border-color: rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }
    .feature-tag:nth-child(2) {
      border-color: rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
    }
    .feature-tag:nth-child(3) {
      border-color: rgba(6, 182, 212, 0.3);
      color: #67e8f9;
    }
    .feature-tag:nth-child(4) {
      border-color: rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    /* Right panel - login form */
    .login-right {
      width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .login-card .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 32px;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }
    .login-form .form-label {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 8px;
      display: block;
    }
    .login-form .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 14px;
      background: rgba(255,255,255,0.03);
      color: #f8fafc;
      transition: all 0.2s;
    }
    .login-form .form-input::placeholder {
      color: #475569;
    }
    .login-form .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background: rgba(255,255,255,0.05);
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
    }
    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .forgot-link {
      font-size: 13px;
      color: #3b82f6;
      text-decoration: none;
    }
    .forgot-link:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }
    .login-btn:hover {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: #475569;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1e293b;
    }

    .sso-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sso-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: #475569;
      color: #e2e8f0;
    }

    .login-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: #475569;
    }
    .login-footer .version {
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <!-- Floating background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>

  <div class="login-container">
    <!-- Left side - Branding -->
    <div class="login-left">
      <div class="brand-logo">
        <div class="logo-mark">A</div>
        <h1>Aria</h1>
      </div>
      <p class="brand-tagline">Intelligent Software-Defined WAN<br>for the Modern Enterprise</p>
      <div class="feature-tags">
        <span class="feature-tag">SD-WAN</span>
        <span class="feature-tag">AI-Powered</span>
        <span class="feature-tag">Multi-Tenant</span>
        <span class="feature-tag">Zero Trust</span>
      </div>
    </div>

    <!-- Right side - Login form -->
    <div class="login-right">
      <div class="login-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your Aria SD-WAN account</p>

        <form class="login-form" onsubmit="return false;">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" placeholder="Enter your username">
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" placeholder="Enter your password">
          </div>

          <div class="form-row">
            <label class="remember-me">
              <input type="checkbox" checked> Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="login-btn">Sign In</button>

          <div class="divider">or continue with</div>

          <button type="button" class="sso-btn">SSO / LDAP Login</button>
        </form>

        <div class="login-footer">
          Aria SD-WAN <span class="version">v0.1.0</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
