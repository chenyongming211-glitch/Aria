[workspace]
resolver = "2"
members = ["agent", "ebpf", "shared"]
default-members = ["agent", "shared"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anomalyco/aria"

[workspace.dependencies]
aya = { version = "0.13.1" }
aya-log = { version = "0.2" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
network-types = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.aria-ebpf]
debug = 2
strip = false
