[package]
name = "aria-agent"
version.workspace = true
edition.workspace = true

[[bin]]
name = "aria-agent"
path = "src/main.rs"

[[bin]]
name = "test-grpc"
path = "../tests/test_grpc_client.rs"

[[bin]]
name = "test-grpc-plain"
path = "../tests/test_grpc_plain.rs"

[[bin]]
name = "test-grpc-sync"
path = "../tests/test_grpc_sync.rs"

[[bin]]
name = "test-wireguard"
path = "../tests/test_wireguard.rs"

[[bin]]
name = "test-routing"
path = "../tests/test_routing.rs"

[[bin]]
name = "test-command-stream-timeout"
path = "../tests/test_command_stream_timeout.rs"

[dependencies]
aya.workspace = true
aya-log.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc.workspace = true
serde_yaml = "0.9"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rcgen = "0.13"
x509-parser = "0.16"
url = "2"

# WireGuard 和网络管理
wireguard-uapi = "3.0"
netlink-packet-route = "0.19"
netlink-packet-wireguard = "0.2"
netlink-proto = "0.11"
netlink-sys = "0.8"
socket2 = "0.5"
base64 = "0.22"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"
ipnetwork = "0.20"
pnet = "0.35"

# gRPC 客户端
tonic = { version = "0.13", features = ["tls-aws-lc"] }
rustls = "0.23"
prost = "0.13"
tokio-stream = "0.1"

[build-dependencies]
cargo_metadata = "0.23"
tonic-build = "0.13"
