// Aria Agent gRPC Protocol
// 基于 internal/cli/up.go 中的 REST API 数据结构设计
// 
// 通信模式：
// - Controller 监听 :50051 (gRPC)
// - Agent 定期轮询 Sync()（5秒间隔）
// - 支持双向认证（TLS）

syntax = "proto3";

package aria.agent;

option go_package = "aria/pkg/grpc/agentpb";

// ============ Controller 服务 ============
// Agent 调用 Controller 的接口（Agent -> Controller）

service ControllerService {
  // Agent 注册（首次启动或重新注册）
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // 定期配置同步（轮询模式，5秒间隔）
  rpc Sync(SyncRequest) returns (SyncResponse);

  // 命令流（双向流，Controller -> Agent）
  rpc CommandStream(stream CommandResponse) returns (stream CommandRequest);

  // 指标上报（Agent -> Controller）
  rpc ReportMetrics(MetricsReportRequest) returns (MetricsReportResponse);
}

// ============ Agent 服务 ============
// Controller 调用 Agent 的接口（Controller -> Agent）
// 预留用于未来推模式或健康检查

service AgentService {
  // 配置下发（推模式，当前未使用）
  rpc SyncConfig(SyncConfigRequest) returns (SyncConfigResponse);
  
  // 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // 统计上报（Agent -> Controller，未来可能使用）
  rpc ReportStats(ReportStatsRequest) returns (ReportStatsResponse);
}

// ============ 注册相关 ============

message RegisterRequest {
  string public_key = 1;              // WireGuard 公钥
  string endpoint = 2;                // 监听地址 ":51820"
  string private_ip = 3;              // 内网 IP（可选）
  string public_ip = 4;               // 公网 IP
  string hostname = 5;                // 主机名
  int64 registered_at = 6;            // 注册时间戳
  string token = 7;                   // 注册 Token
  repeated string advertised_routes = 8;  // Site-to-Site VPN 路由
  string region = 9;                  // 地域
  string customer_id = 10;            // 客户 ID
  
  // 能力检测
  string runtime_mode = 11;           // "kernel" or "ebpf"
  string kernel_version = 12;         // 内核版本
  bool has_aesni = 13;                // 是否支持 AES-NI
  string machine_id = 14;             // 机器稳定标识
}

message RegisterResponse {
  string assigned_ip = 1;             // 分配的 VPN IP
  string metrics_push_gateway = 2;    // Prometheus Push Gateway URL
  string node_id = 3;                 // 平台侧稳定节点身份
  string runtime_token = 4;           // 运行期短期凭据
  int64 runtime_token_expires_at = 5; // 运行期凭据过期时间戳
}

// ============ 同步相关 ============

message SyncRequest {
  string public_key = 1;              // 兼容字段：运行期按 public_key 查找节点
  string node_id = 2;                 // 优先字段：运行期按 node_id 查找节点
  string applied_state_version = 3;   // Agent 当前已应用的 desired state 版本
  string observed_state = 4;          // Agent 当前观测状态：applied / healthy / error / in_progress
  string observed_message = 5;        // Agent 当前观测说明或错误信息
  string public_ip = 6;               // Agent 观测到的真实公网 IPv4，不能是本地/VPC 地址
  string endpoint = 7;                // Agent 对外可达 WireGuard 端点
}

message SyncResponse {
  repeated PeerInfo peers = 1;        // WireGuard Peers 列表
  string assigned_ip = 2;             // 当前节点的 VPN IP
  int64 last_update = 3;              // 最后更新时间戳
  repeated ACLRule acl_rules = 4;     // 防火墙 ACL 规则
  string metrics_push_gateway = 5;    // Prometheus Push Gateway URL
  
  repeated QoSRule qos_rules = 6;            // QoS 限速规则
  repeated BlacklistRule blacklist_rules = 7; // 黑名单规则
  string desired_state_version = 8;          // Controller 当前期望配置版本
  string runtime_token = 9;                  // 刷新后的运行期凭据
  int64 runtime_token_expires_at = 10;       // 运行期凭据过期时间戳
  bool snapshot_complete = 11;               // 本轮同步快照是否完整
  map<string, string> domain_versions = 12;  // 各控制面 domain 的版本
}

message PeerInfo {
  string public_key = 1;              // WireGuard 公钥
  string endpoint = 2;                // UDP 端点地址
  string private_ip = 3;              // 内网 IP
  string public_ip = 4;               // 公网 IP
  string region = 5;                  // 地域
  string vpc_id = 6;                  // VPC ID
  string hostname = 7;                // 主机名
  string assigned_ip = 8;             // VPN IP
  string role = 9;                    // 角色
  repeated string advertised_routes = 10;  // Site-to-Site VPN 路由
}

message ACLRule {
  string id = 9;                      // Controller policy rule ID
  string src_net = 1;                 // 源 CIDR（如 "10.0.0.0/8"）
  string dst_net = 2;                 // 目标 CIDR（如 "192.168.0.0/16"）
  uint32 protocol = 3;                // IP 协议（6=TCP, 17=UDP, 0=any）
  uint32 min_port = 4;                // 最小端口（0=any）
  uint32 max_port = 5;                // 最大端口（65535=any）
  string action = 6;                  // 动作：allow 或 deny
  string direction = 7;               // 方向：ingress、egress、both
  string ports = 8;                   // 端口 bitmap 规则（如 "80-82,443:0"）
}

message QoSRule {
  string id = 12;                     // Controller policy rule ID
  string src_ip = 1;                  // 源 IP
  string dst_ip = 2;                  // 目标 IP
  uint32 src_port = 3;                // 源端口
  uint32 dst_port = 4;                // 目标端口
  uint32 protocol = 5;                // 协议
  uint64 bandwidth_mbps = 6;          // 带宽限制
  string direction = 7;               // 方向：ingress 或 egress
  uint64 rate_bps = 8;                // 精确速率（bps）
  uint64 burst_bytes = 9;             // 突发字节数
  uint32 priority = 10;               // 优先级
  string mode = 11;                   // policing 或 shaping
}

message BlacklistRule {
  string scope = 1;                   // src, dst, ports
  string cidr = 2;                    // CIDR for src/dst blacklist
  uint32 port = 3;                    // Port for port blacklist
}

// ============ 配置下发（推模式，预留） ============

message SyncConfigRequest {
  repeated PeerConfig peers = 1;      // Peer 配置
  repeated ACLRule acl_rules = 2;     // ACL 规则
  repeated QoSRule qos_rules = 3;     // QoS 规则
  repeated BlacklistRule blacklist_rules = 4; // 黑名单规则
}

message SyncConfigResponse {
  bool success = 1;
  string message = 2;
}

message PeerConfig {
  string public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  uint32 persistent_keepalive = 4;
}

// ============ 健康检查 ============

message HealthCheckRequest {
  string agent_id = 1;
}

message HealthCheckResponse {
  bool healthy = 1;
  string message = 2;
  AgentStats stats = 3;
}

message AgentStats {
  uint64 total_peers = 1;             // 总 Peer 数
  uint64 active_peers = 2;            // 活跃 Peer 数
  double cpu_usage = 3;               // CPU 使用率
  double memory_usage = 4;            // 内存使用率
  uint64 tx_bytes = 5;                // 发送字节数
  uint64 rx_bytes = 6;                // 接收字节数
}

// ============ 统计上报 ============

message ReportStatsRequest {
  string agent_id = 1;
  AgentStats stats = 2;
}

message ReportStatsResponse {
  bool success = 1;
}

// ============ 命令流相关 ============
// Controller -> Agent 命令下发

message CommandRequest {
  string command_id = 1;            // 命令唯一ID
  string command = 2;               // 命令类型: "sync", "restart", "config_reload", "health_check"
  map<string, string> params = 3;   // 命令参数
  int32 timeout = 4;                // 超时时间（秒）
  int32 priority = 5;               // 优先级: 0=普通, 1=高, 2=紧急
  int64 created_at = 6;             // 命令创建时间戳
}

message CommandResponse {
  string command_id = 1;            // 命令唯一ID
  string status = 2;                // pending, acknowledged, completed, failed
  string message = 3;               // 状态消息或错误信息
  map<string, string> result = 4;   // 命令执行结果
  int64 completed_at = 5;           // 命令完成时间戳
  string node_id = 6;               // 运行期稳定节点身份
  string public_key = 7;            // 兼容字段
}

// ============ 指标上报相关 ============

message MetricsReportRequest {
  string agent_id = 1;              // 兼容字段：历史上报身份（通常为 public_key）
  int64 timestamp = 2;              // 上报时间戳
  
  // 系统指标
  double cpu_usage = 3;             // CPU 使用率 (0-100)
  double memory_usage = 4;          // 内存使用率 (0-100)
  uint64 memory_total = 5;          // 总内存 (bytes)
  uint64 memory_used = 6;           // 已用内存 (bytes)
  double disk_usage = 7;            // 磁盘使用率 (0-100)
  uint64 disk_total = 8;            // 总磁盘 (bytes)
  uint64 disk_used = 9;             // 已用磁盘 (bytes)
  
  // 网络指标
  uint64 network_tx_bytes = 10;     // 发送字节数
  uint64 network_rx_bytes = 11;     // 接收字节数
  uint64 network_tx_packets = 12;   // 发送包数
  uint64 network_rx_packets = 13;   // 接收包数
  uint64 network_tx_errors = 14;    // 发送错误数
  uint64 network_rx_errors = 15;    // 接收错误数
  
  // WireGuard 指标
  uint64 wg_tx_bytes = 16;          // WireGuard 发送字节数
  uint64 wg_rx_bytes = 17;          // WireGuard 接收字节数
  uint32 wg_peer_count = 18;        // WireGuard Peer 数量
  uint32 wg_active_peers = 19;      // 活跃 Peer 数量
  
  // 自定义指标
  map<string, double> custom_metrics = 20;  // 自定义指标键值对
  string node_id = 21;             // 优先字段：运行期稳定节点身份
  string public_key = 22;          // 兼容字段：当前节点 WireGuard 公钥
}

message MetricsReportResponse {
  bool success = 1;
  string message = 2;
}
