# Aria Web - Nginx Configuration (HTTPS Only)
#
# Prerequisites:
#   1. Generate self-signed certificate:
#      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout certs/server.key -out certs/server.crt \
#        -subj '/CN=aria.yun/O=Aria SD-WAN/C=CN' \
#        -addext 'subjectAltName=DNS:aria.yun'
#
#   2. Compress images before deploy:
#      pngquant --quality=65-85 --force public/aria-3d-cloud.png
#      pngquant --quality=65-85 --force public/aria-logo.png

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

upstream aria_api {
    server aria_controller:8080;
    keepalive 32;
}

upstream victoria_metrics {
    server aria-victoria-metrics:8428;
    keepalive 32;
}

upstream grafana {
    server aria-grafana:3000;
    keepalive 32;
}

upstream vmalert {
    server aria-vmalert:8880;
    keepalive 32;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static assets (Vite hashed filenames) - 1 year cache
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images - 30 day cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA frontend routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://aria_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Southbound API (agent registration)
    location /register {
        proxy_pass http://aria_api/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /unregister {
        proxy_pass http://aria_api/unregister;
    }

    location /version {
        proxy_pass http://aria_api/version;
    }

    location /network/manage {
        proxy_pass http://aria_api/network/manage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Monitoring services
    location /metrics/ {
        proxy_pass http://victoria_metrics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /vmalert/ {
        proxy_pass http://vmalert/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
