---
# 全局变量（包含敏感信息，仅用于测试）

# -------------------- 数据库配置 --------------------
vault_postgres_host: aria-postgres
vault_postgres_port: 5432
vault_postgres_user: aria
vault_postgres_password: aria-local-password
vault_postgres_database: aria

# Redis
vault_redis_addr: aria-redis:6379
vault_redis_password: ""

# DeepSeek AI
vault_deepseek_api_key: sk-44fc7def9839422390f8d2018967081f
vault_deepseek_base_url: https://api.deepseek.com
vault_deepseek_model: deepseek-chat
vault_deepseek_system_prompt: "You are Aria's intelligent operations assistant."

# 飞书
vault_feishu_app_id: cli_a9f4b69ae5b8dbb3
vault_feishu_app_secret: TSbiUWpalWbbIZ7t6Je3IfUgcqtWOBvF
vault_feishu_encrypt_key: ""
vault_feishu_verify_token: X12NiE0nKEQltttec2p7ynlNHrBkjDvx

# Agent 证书路径
vault_ca_cert_path: /etc/aria/certs/ca/ca.crt
vault_agent_cert_path: /etc/aria/certs/agents
vault_agent_key_path: /etc/aria/certs/agents

# -------------------- 网络配置 --------------------
aria_network_base_ip: 100.64.0.0
aria_network_cidr: 100.64.0.0/16

# Agent IP池（按region自动分配）
aria_agent_ip_pool:
  sh: 100.64.0.1
  bj: 100.64.0.2
  gz: 100.64.0.3
  sz: 100.64.0.4
  shanghai: 100.64.0.1
  beijing: 100.64.0.2

# Agent 默认配置
aria_agent_defaults:
  interface_name: aria0
  listen_port: 51820
  mtu: 1360
  sync_interval: 5
  multi_tunnel: true

# -------------------- Controller 配置 --------------------
aria_controller_port: 8080
aria_controller_grpc_port: 50051
aria_controller_domain: aria.yun

# -------------------- gRPC TLS 配置 --------------------
# TLS模式: disabled (HTTP), server (单向TLS), mutual (双向mTLS)
aria_grpc_tls_mode: server
aria_grpc_server_cert: /etc/aria/certs/grpc-server.crt
aria_grpc_server_key: /etc/aria/certs/grpc-server.key
aria_grpc_ca_cert: /etc/aria/certs/ca.crt

# -------------------- Agent 配置 --------------------
aria_agent_sync_interval: 5
aria_agent_multi_tunnel: true

# -------------------- 部署配置 --------------------
# Controller 部署目录
aria_controller_deploy_dir: /root/aria-controller
aria_controller_config_dir: "{{ aria_controller_deploy_dir }}/config"
aria_controller_certs_dir: "{{ aria_controller_deploy_dir }}/certs"
aria_controller_images_dir: "{{ aria_controller_deploy_dir }}/bin/images"
aria_controller_image: ghcr.io/chenyongming211-glitch/aria-controller:0.2.35-test

# Agent 部署目录
aria_agent_deploy_dir: /root/aria-agent
aria_agent_config_dir: /etc/aria
aria_agent_certs_dir: /etc/aria/certs

# -------------------- 日志配置 --------------------
aria_log_level: info
aria_log_dir: /var/log/aria
