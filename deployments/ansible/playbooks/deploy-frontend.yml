---
# Frontend deployment playbook.
# The frontend must be built by GitHub Actions and downloaded as the
# `frontend-dist` artifact before this playbook runs.

- name: Deploy Aria Frontend
  hosts: controller
  gather_facts: yes
  become: yes

  vars:
    frontend_artifact_dir: /tmp/aria-frontend-dist
    frontend_remote_dir: /root/aria-controller/frontend/dist

  tasks:
    - name: Ensure frontend parent directory exists
      ansible.builtin.file:
        path: /root/aria-controller/frontend
        state: directory
        mode: "0755"

    - name: Upload prebuilt frontend artifact
      ansible.posix.synchronize:
        src: "{{ frontend_artifact_dir }}/"
        dest: "{{ frontend_remote_dir }}.new/"
        delete: yes
        dirs: yes
      delegate_to: localhost
      become: no

    - name: Swap frontend artifact into place
      ansible.builtin.shell: |
        set -e
        cd /root/aria-controller/frontend
        rm -rf dist.previous
        if [ -d dist ]; then
          mv dist dist.previous
        fi
        mv dist.new dist
      args:
        executable: /bin/bash

    - name: Restart frontend container
      ansible.builtin.command: docker restart aria-frontend

    - name: Verify frontend health through API proxy
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/api/version
        method: GET
        status_code: 200
        return_content: true
      register: frontend_version

    - name: Show frontend API version
      ansible.builtin.debug:
        msg: "{{ frontend_version.content }}"
