---
# Agent 部署 Playbook

- name: Deploy Aria Agent
  hosts: agent
  gather_facts: yes
  become: yes

  vars:
    aria_agent_binary_src: "{{ lookup('env', 'ARIA_AGENT_BINARY') | default(playbook_dir + '/../../../agent-rust/target/release/aria-agent', true) }}"
    aria_agent_binary_path: /usr/local/bin/aria-agent
    aria_agent_service_name: aria-agent
    aria_agent_config_dir: /etc/aria
    aria_agent_state_dir: /var/lib/aria
    aria_agent_log_dir: /var/log/aria

  tasks:
    - name: Install runtime dependencies
      ansible.builtin.apt:
        pkg:
          - iproute2
          - wireguard-tools
        state: present
      ignore_errors: yes

    - name: Check local Agent binary artifact
      ansible.builtin.stat:
        path: "{{ aria_agent_binary_src }}"
      delegate_to: localhost
      become: no
      register: aria_agent_binary_stat

    - name: Require local Agent binary artifact
      ansible.builtin.fail:
        msg: "Agent binary artifact not found at {{ aria_agent_binary_src }}. Build it with CI or set ARIA_AGENT_BINARY."
      when: not aria_agent_binary_stat.stat.exists

    - name: Ensure Agent directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ aria_agent_config_dir }}"
        - "{{ aria_agent_state_dir }}"
        - "{{ aria_agent_log_dir }}"

    - name: Copy Agent binary to temporary path
      ansible.builtin.copy:
        src: "{{ aria_agent_binary_src }}"
        dest: "{{ aria_agent_binary_path }}.new"
        owner: root
        group: root
        mode: "0755"

    - name: Deploy new binary atomically
      ansible.builtin.command:
        cmd: "mv -f {{ aria_agent_binary_path }}.new {{ aria_agent_binary_path }}"

    - name: Restart Agent service
      ansible.builtin.systemd:
        name: "{{ aria_agent_service_name }}"
        state: restarted
        daemon_reload: yes
        enabled: yes
