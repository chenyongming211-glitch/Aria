---
# Controller deployment playbook.
# Release images are built by GitHub Actions and pulled from GHCR on the host.

- name: Deploy Aria Controller
  hosts: controller
  gather_facts: yes
  become: yes

  vars:
    aria_controller_version: "{{ lookup('env', 'ARIA_CONTROLLER_VERSION') | default(lookup('file', playbook_dir + '/../../../VERSION') | trim, true) }}"
    aria_controller_deploy_dir: /root/aria-controller
    aria_controller_image: "{{ lookup('env', 'ARIA_CONTROLLER_IMAGE') | default('ghcr.io/chenyongming211-glitch/aria-controller:' ~ aria_controller_version, true) }}"
    aria_grpc_tls_mode: server

  tasks:
    - name: Ensure Controller directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ aria_controller_deploy_dir }}"
        - "{{ aria_controller_deploy_dir }}/config"
        - "{{ aria_controller_deploy_dir }}/certs"
        - "{{ aria_controller_deploy_dir }}/logs"
        - "{{ aria_controller_deploy_dir }}/data/backups"
        - "{{ aria_controller_deploy_dir }}/frontend/dist"

    - name: Render Controller environment
      ansible.builtin.template:
        src: ../roles/controller/templates/controller.env.j2
        dest: "{{ aria_controller_deploy_dir }}/.env"
        mode: "0600"

    - name: Render Docker Compose
      ansible.builtin.template:
        src: ../roles/controller/templates/docker-compose.yml.j2
        dest: "{{ aria_controller_deploy_dir }}/docker-compose.yml"
        mode: "0600"

    - name: Pull Controller image from GHCR
      ansible.builtin.command:
        cmd: "docker pull {{ aria_controller_image }}"
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"
      register: pull_result

    - name: Apply Controller compose
      ansible.builtin.command:
        cmd: docker compose up -d aria-controller
        chdir: "{{ aria_controller_deploy_dir }}"

    - name: Verify Controller HTTP health
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/api/version
        method: GET
        status_code: 200
        return_content: true
      register: controller_version

    - name: Show deployed version
      ansible.builtin.debug:
        msg: "{{ controller_version.content }}"
