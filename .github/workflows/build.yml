name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write

jobs:
  go-build:
    name: Go Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set build variables
        id: vars
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "0.1.0")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "ldflags=-X aria/internal/cli.Version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Run Go tests
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -ldflags "${{ steps.vars.outputs.ldflags }}" -o bin/aria-controller ./cmd
          go build -o bin/ariactl ./cmd/ariactl
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${{ steps.vars.outputs.ldflags }}" -o bin/aria-controller-linux-amd64 ./cmd
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${{ steps.vars.outputs.ldflags }}" -o bin/aria-controller-linux-arm64 ./cmd

      - name: Upload Go artifacts
        uses: actions/upload-artifact@v7.0.1
        continue-on-error: true
        with:
          name: go-binaries
          path: |
            bin/aria-controller
            bin/ariactl
            bin/aria-controller-linux-amd64
            bin/aria-controller-linux-arm64
          if-no-files-found: error

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: go-build
    # 只在手动触发时构建镜像
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set version
        id: vars
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.1.0')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Controller image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile.controller
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aria-controller:latest
            ghcr.io/${{ github.repository_owner }}/aria-controller:${{ steps.vars.outputs.version }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}

  rust-agent-build:
    name: Rust Agent Build
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-Dwarnings"
    defaults:
      run:
        working-directory: agent-rust

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            libelf-dev \
            libbpf-dev \
            pkg-config \
            protobuf-compiler

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install nightly \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component rust-src \
            --target x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: "agent-rust -> target"

      - name: Install bpf-linker
        run: cargo +stable install bpf-linker --locked

      - name: Run Rust agent tests
        run: cargo test -p aria-agent --lib

      - name: Build Rust agent
        run: |
          rm -rf target/release
          cargo build --release -p aria-agent
          ldd target/release/aria-agent
          target/release/aria-agent --version

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v7.0.1
        continue-on-error: true
        with:
          name: rust-agent-binary
          path: agent-rust/target/release/aria-agent
          if-no-files-found: error

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7.0.1
        continue-on-error: true
        with:
          name: frontend-dist
          path: temp-dist
          if-no-files-found: error
